name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  fresh-install:
    # Installs without uv.lock so that unbounded dependency releases
    # (e.g. mcp 2.x removing mcp.server.fastmcp) break CI, not users.
    name: Fresh install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package without lockfile
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev]"
        python -m pip list

    - name: Import server
      env:
        UPSTAGE_API_KEY: dummy
      run: python -c "import upstage_mcp.server"

    - name: Run tests
      env:
        UPSTAGE_API_KEY: dummy
      run: pytest -q
