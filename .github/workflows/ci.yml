name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  fresh-install:
    # Installs without uv.lock so that unbounded dependency releases
    # (e.g. mcp 2.x removing mcp.server.fastmcp) break CI, not users.
    name: Fresh install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package without lockfile
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[dev]"
        python -m pip list

    - name: Import server
      env:
        UPSTAGE_API_KEY: dummy
      run: python -c "import upstage_mcp.server"

    - name: Run tests
      env:
        UPSTAGE_API_KEY: dummy
      run: pytest -q

  locked:
    # Runs against the committed uv.lock and fails if it is out of date with pyproject.toml.
    name: Locked install (uv.lock)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v6

    - name: Check lockfile is up to date
      run: uv lock --check

    - name: Install from lockfile
      run: uv sync --frozen --extra dev

    - name: Run tests
      env:
        UPSTAGE_API_KEY: dummy
      run: uv run --frozen pytest -q
